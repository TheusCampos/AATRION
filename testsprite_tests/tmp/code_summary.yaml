version: "2"
type: backend
tech_stack:
  - language: TypeScript
  - framework: Next.js 14 (App Router API Routes)
  - database: Prisma ORM with SQLite (dev) / PostgreSQL (prod)
  - other:
    - Clerk (autenticação)
    - Google Gemini + OpenRouter (IA)
    - Zod (validação)
    - Upstash Redis (rate limiting)
    - AWS S3 (upload de arquivos)
    - Stripe (pagamentos)
    - Resend (email)
features:
  - name: Resume Management
    description: CRUD operations for resumes with AI analysis and adaptation
    files:
      - app/api/resumes/route.ts
      - app/api/resumes/[id]/route.ts
      - app/api/resumes/[id]/analyze/route.ts
      - app/api/resumes/[id]/adapt/route.ts
      - app/api/resumes/import/route.ts
    endpoints:
      - method: GET
        path: /api/resumes
        description: List all resumes for authenticated user
        auth_required: true
        response_schema:
          "200": Resume[]
      - method: POST
        path: /api/resumes
        description: Create a new resume
        auth_required: true
        request_schema:
          body:
            title: string
            content: string
            templateId: string
        response_schema:
          "200": Resume
      - method: GET
        path: /api/resumes/[id]
        description: Get specific resume by ID
        auth_required: true
        response_schema:
          "200": Resume
          "404": Not found
      - method: PUT
        path: /api/resumes/[id]
        description: Update resume
        auth_required: true
        request_schema:
          body:
            title: string
            content: string
        response_schema:
          "200": Resume
      - method: DELETE
        path: /api/resumes/[id]
        description: Delete resume
        auth_required: true
        response_schema:
          "200": Success
      - method: POST
        path: /api/resumes/[id]/analyze
        description: Analyze resume with AI for ATS score
        auth_required: true
        request_schema:
          body:
            targetJob: string
        response_schema:
          "200": AnalysisResult
          "500": AI Error
      - method: POST
        path: /api/resumes/[id]/adapt
        description: Adapt resume for specific job using AI
        auth_required: true
        request_schema:
          body:
            jobTitle: string
            jobDescription: string
        response_schema:
          "200": AdaptedResume
          "500": AI Error
      - method: POST
        path: /api/resumes/import
        description: Import resume from PDF or DOCX file
        auth_required: true
        request_schema:
          body:
            file: binary
        response_schema:
          "200": ExtractedResume
  - name: LinkedIn Audit
    description: Audit LinkedIn profiles with AI analysis
    files:
      - app/api/linkedin/audit/route.ts
      - app/api/linkedin/audit/[id]/route.ts
    endpoints:
      - method: GET
        path: /api/linkedin/audit
        description: List all LinkedIn audits for user
        auth_required: true
        response_schema:
          "200": LinkedInAudit[]
      - method: POST
        path: /api/linkedin/audit
        description: Create new LinkedIn audit
        auth_required: true
        request_schema:
          body:
            profileText: string
            area: string
            targetJob: string
        response_schema:
          "200": LinkedInAuditResult
          "500": AI Error
      - method: GET
        path: /api/linkedin/audit/[id]
        description: Get specific audit result
        auth_required: true
        response_schema:
          "200": LinkedInAuditResult
          "404": Not found
      - method: DELETE
        path: /api/linkedin/audit/[id]
        description: Delete audit
        auth_required: true
        response_schema:
          "200": Success
  - name: Job Search
    description: Search jobs using Adzuna API
    files:
      - app/api/jobs/route.ts
    endpoints:
      - method: GET
        path: /api/jobs
        description: Search jobs by keyword and location
        auth_required: true
        query_params:
          q: string
          location: string
        response_schema:
          "200": JobSearchResult[]
  - name: User Settings
    description: User account settings management
    files:
      - app/api/user/settings/route.ts
    endpoints:
      - method: GET
        path: /api/user/settings
        description: Get user settings
        auth_required: true
        response_schema:
          "200": UserSettings
      - method: PUT
        path: /api/user/settings
        description: Update user settings
        auth_required: true
        request_schema:
          body:
            name: string
            phone: string
            location: string
            linkedinUrl: string
        response_schema:
          "200": UserSettings
  - name: Authentication
    description: Authentication via Clerk
    files:
      - middleware.ts
      - lib/auth.ts
    endpoints:
      - method: GET
        path: /api/health
        description: Health check endpoint
        auth_required: false
        response_schema:
          "200": HealthStatus
known_limitations:
  - issue: No rate limiting implemented on AI endpoints
    location: app/api/resumes/[id]/analyze/route.ts
    impact: Users can abuse AI calls without limits
  - issue: No input sanitization for prompt injection
    location: app/api/resumes/[id]/adapt/route.ts
    impact: Malicious prompts could manipulate AI behavior
  - issue: CORS allows wildcard origin
    location: next.config.mjs
    impact: API can be called from any origin
  - issue: No CSRF protection
    location: API routes
    impact: Cross-site requests possible
  - issue: Stack traces exposed in dev mode
    location: Error handling
    impact: Internal paths revealed in errors
  - issue: AI response not validated with schema
    location: app/api/resumes/[id]/adapt/route.ts
    impact: Malformed AI responses could break system
